[project]
name = "raphael-backend"
version = "0.1.0"
description = "Raphael Memory Capture API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1.0",
    "pymongo>=4.14,<5.0",
    "firebase-admin>=7.0,<8.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
